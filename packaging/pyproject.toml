[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-editor"
version = "2026.11.27"
description = "A Python/Tkinter code editor with project, Git and team collaboration plugins"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Somi Douth", email = "somidouth@gmail.com"}]
keywords = ["editor", "tkinter", "git", "collaboration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Programming Language :: Python :: 3",
  "Topic :: Text Editors",
]

[project.urls]
Homepage = "https://sourceforge.net/projects/pocket-editor/"
Source = "https://github.com/somidouth-collab/pocket-editor"
Issues = "https://github.com/somidouth-collab/pocket-editor/issues"
Documentation = "https://github.com/somidouth-collab/pocket-editor/blob/main/INSTALL.md"

[project.gui-scripts]
pocket-editor = "pocket_editor_app.launcher:main"

[tool.setuptools]
packages = ["pocket_editor_app"]
include-package-data = true

[tool.setuptools.package-data]
pocket_editor_app = ["_payload/**/*", "_payload/*"]
