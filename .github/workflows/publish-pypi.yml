name: Build and publish PyPI package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -B -m unittest -v test_external_files.ProbeTests test_web_tools.SettingsTests test_release test_pypi test_ai_assistant.ProtocolTests test_ai_assistant.GeminiTests test_git_executable test_codex_loading.CodexRunnerTests test_cpp_tools.BackendTests
      - run: python -B tools/build_pypi.py
      - run: python -m twine check --strict dist/pypi/*
      - run: python -B tools/check_pypi.py dist/pypi
      - run: python -m pip install --no-deps dist/pypi/*.whl
      - run: pocket-editor --help
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/pypi/*
          if-no-files-found: error
  windows-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B -m unittest -v test_git_executable test_ai_assistant.ProtocolTests test_ai_assistant.GeminiTests test_codex_loading.CodexRunnerTests test_cpp_tools.BackendTests test_windows_editing test_keyboard_input
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/web --ignore-scripts --no-audit --no-fund
      - run: python -m venv tools/terminal/.venv
      - run: tools/terminal/.venv/Scripts/python.exe -m pip install -r tools/terminal/requirements.txt
      - run: python -B -m unittest -v test_web_tools.BackendTests test_web_tools.SettingsTests test_external_files.ProbeTests test_terminal_interactive.ScreenTests
      - run: python -B tools/run_gui_tests.py test_document_shortcuts test_search_panels test_document_context test_web_tools.GuiTests test_terminal_interactive.TerminalMenuTests test_terminal_interactive.TerminalSelectionTests test_external_files.ExternalFileTests
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, windows-compatibility]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pocket-editor
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
